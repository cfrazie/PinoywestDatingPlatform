[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    # Security Headers
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' https://mfyhaltgnrxxo5dsmfrwwltdn4rts43snzrxki32gy3hkmtr.apiii.co https://www.googletagmanager.com https://www.google-analytics.com https://static.hotjar.com https://script.hotjar.com https://tagmanager.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co https://www.google-analytics.com https://api.emailjs.com https://www.googletagmanager.com; frame-src 'self' https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Access-Control-Allow-Origin = "https://pinoywest.netlify.app"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Max-Age = "86400"

[[redirects]]
  from = "http://pinoywest.netlify.app/*"
  to = "https://pinoywest.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Security redirects for common attack vectors
[[redirects]]
  from = "/.env*"
  to = "/"
  status = 301

[[redirects]]
  from = "/.git*"
  to = "/"
  status = 301

[[redirects]]
  from = "/wp-admin*"
  to = "/"
  status = 301

[[redirects]]
  from = "/admin.php*"
  to = "/"
  status = 301

[[redirects]]
  from = "/config*"
  to = "/"
  status = 301

# Rate limiting (requires Netlify Pro)
[[edge_functions]]
  function = "rate-limit"
  path = "/api/*"